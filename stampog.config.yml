name: stampog
mode: emoji
format: "{env}-{cloud}-{token1}-{token2}-{word1}-{word2}-{date}-{time}-{user}@{commit}"

env:
  auto: true
  sources:
    - VITE_ENV
    - NODE_ENV
    - DEPLOY_ENV
  map:
    production: prd
    staging: stg
    development: dev
    test: tst
  fallback: dev

cloud:
  enabled: true
  auto: true
  sources:
    - VERCEL
    - NETLIFY
    - GITHUB_ACTIONS
    - RAILWAY_ENVIRONMENT
    - FLY_APP_NAME
    - RENDER
    - CF_PAGES
    - GOOGLE_CLOUD_PROJECT
    - AWS_REGION
    - AZURE_CLIENT_ID
    - AZURE_SUBSCRIPTION_ID
  fallback: loc

tokens:
  count: 2

date:
  format: "yyyy-mm-dd"
  timezone: "local"

time:
  enabled: true
  format: "hh:mm"
  timezone: "local"

words:
  count: 2
  allow:
    - silver
    - golden
    - crimson
    - azure
    - violet
    - amber
    - jade
    - coral
    - ivory
    - slate
    - river
    - forest
    - mountain
    - ocean
    - canyon
    - valley
    - island
    - delta
    - glacier
    - melon
    - mango
    - cherry
    - lemon
    - peach
    - plum
    - grape
    - orbit
    - pixel
    - vector
    - debug
    - patch
    - build
    - deploy
    - branch
    - matrix
    - kernel
    - socket
    - buffer
    - cipher
    - proxy
    - router
    - rocket
    - thunder
    - signal
    - echo
    - mirror
    - shadow
    - phantom
    - nova
    - spark
    - comet
    - garden
    - banana
    - arcade

emojis:
  allow:
    - 🍉
    - 🍏
    - 🍌
    - 🍇
    - 🍊
    - 🍋
    - 🛠️
    - 🚀
    - 🐶
    - 🧪
    - 🎮
    - ✨
    - 🧰
    - 🌊
    - 🔥
    - 🎯
    - 💡
    - 🦊
    - 🐙
    - 🎸

ascii:
  allow:
    - WM
    - TL
    - RX
    - DG
    - PX
    - QA
    - CI
    - GH
    - OK
    - BG
    - FX
    - MG
    - VX
    - ZN

git:
  commitLength: 7
  includeBranch: false
  includeDirty: true
  dirtyMarker: "~"
  usernameSource: github
  fallbackUsernameSource: git-config

badge:
  enabled: true
  position: bottom-right
  startVisible: true
  copyOnClick: true
  showDetailsOnClick: true
  theme: dark

output:
  json: "dist/stampog.json"
  js: "dist/stampog.js"
  htmlSnippet: "dist/stampog-snippet.html"
