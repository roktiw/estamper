date:
  enabled: true
  format: yyyy-mm-dd
  timezone: local
  source: auto
  env:
    - ESTAMPER_DATE
    - BUILD_DATE
    - SOURCE_DATE_EPOCH
time:
  enabled: true
  format: hh:mm
  timezone: local
user:
  enabled: true
  source: auto
  fallback: anonymous
  maxLength: 20
  sanitize: true
  sources:
    - GITHUB_ACTOR
    - GITLAB_USER_LOGIN
    - CIRCLE_USERNAME
    - BUILD_USER
    - USER
commit:
  enabled: true
  length: 7
  prefix: "@"
  includeDirty: true
  dirtyMarker: "~"
  fallback: "0000000"
  sources:
    - GITHUB_SHA
    - VERCEL_GIT_COMMIT_SHA
    - NETLIFY_COMMIT_REF
    - CI_COMMIT_SHA
branch:
  enabled: false
  prefix: "~"
  maxLength: 20
  sanitize: true
  fallback: null
  sources:
    - GITHUB_REF_NAME
    - VERCEL_GIT_COMMIT_REF
    - BRANCH
    - CI_COMMIT_BRANCH
buildNumber:
  enabled: false
  prefix: "#"
  source: auto
  fallback: null
  sources:
    - GITHUB_RUN_NUMBER
    - BUILD_NUMBER
    - CI_PIPELINE_IID
    - VERCEL_GIT_COMMIT_SHA
badge:
  enabled: true
  position: bottom-right
  theme: auto
  copyOnClick: true
  showDetailsOnClick: true
  persistPosition: true
  draggable: false
  zIndex: 999999
  startVisible: true
output:
  json: dist/estamper.json
  js: dist/estamper.js
  htmlSnippet: dist/estamper-snippet.html
  css: dist/estamper.css
  meta: true
validation:
  maxStampLength: 96
  failOnUnknownEmoji: false
  failOnUnknownWord: false
  requireGit: false
  requireCommit: false
  allowUnsafeChars: false
