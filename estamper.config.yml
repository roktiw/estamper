    - word: grape
      code2: GP
      code3: GRP
    - word: silver
      code2: SV
      code3: SLV
    - word: golden
      code2: GD
      code3: GLD
    - word: crimson
      code2: CR
      code3: CRM
    - word: azure
      code2: AZ
      code3: AZR
    - word: violet
      code2: VT
      code3: VLT
    - word: amber
      code2: AM
      code3: AMB
    - word: jade
      code2: JD
      code3: JDE
    - word: coral
      code2: CL
      code3: CRL
    - word: river
      code2: RV
      code3: RVR
    - word: forest
      code2: FR
      code3: FRS
    - word: mountain
      code2: MT
      code3: MTN
    - word: ocean
      code2: OC
      code3: OCN
    - word: garden
      code2: GR
      code3: GRD
    - word: canyon
      code2: CN
      code3: CYN
    - word: valley
      code2: VL
      code3: VLY
    - word: island
      code2: IS
      code3: ISL
    - word: orbit
      code2: OR
      code3: ORB
    - word: pixel
      code2: PX
      code3: PXL
    - word: vector
      code2: VC
      code3: VEC
    - word: debug
      code2: DG
      code3: DBG
    - word: patch
      code2: PT
      code3: PTC
    - word: build
      code2: BD
      code3: BLD
    - word: deploy
      code2: DP
      code3: DPL
