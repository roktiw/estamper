schemaVersion: 1
name: estamper
mode: auto
preset: standard
format: "{env}-{cloud}-{token1}-{token2}-{word1}-{word2}-{date}-{time}-{user}@{commit}"
seed:
  strategy: commit
  fixed: null
env:
  enabled: true
  value: auto
  fallback: dev
  map:
    production: prd
    prod: prd
    staging: stg
    stage: stg
    development: dev
    dev: dev
    test: tst
    qa: qat
    ci: ci
    local: loc
  sources:
    - ESTAMPER_ENV
    - DEPLOY_ENV
    - APP_ENV
    - VITE_ENV
    - NODE_ENV
    - VERCEL_ENV
    - NETLIFY_CONTEXT
cloud:
  enabled: true
  provider: auto
  fallback: loc
  map:
    azure: az
    gcp: gcp
    google-cloud: gcp
    aws: aws
    vercel: vcl
    netlify: ntl
    firebase: fb
  detection:
    VERCEL: vcl
    NETLIFY: ntl
    FIREBASE_CONFIG: fb
    GITHUB_ACTIONS: ghp
    CF_PAGES: cfp
    FLY_APP_NAME: fly
    RAILWAY_ENVIRONMENT: rwy
    RENDER: rndr
    GOOGLE_CLOUD_PROJECT: gcp
    AWS_REGION: aws
    AZURE_CLIENT_ID: az
tokens:
  enabled: true
  count: 2
  mode: auto
  separator: "-"
  asciiLength: 2
  emoji:
    allow:
      - 🏷️
      - ✅
      - 🔖
      - 📌
      - 🧾
      - 📜
      - 🪪
      - 🔏
      - 🖋️
      - ✒️
      - 🧰
      - 🛠️
      - 🚀
      - 🧪
      - 🎟️
      - 🎫
      - 🪙
      - 🧱
      - 🔐
    deny: []
  ascii:
    allow:
      - ST
      - MK
      - TAG
      - LBL
      - SEAL
      - OK
      - CHK
      - SIG
      - ID
      - VER
      - REL
      - BLD
      - DEP
      - CI
      - QA
      - GIT
      - SHA
      - RUN
      - TKT
      - CERT
      - LOCK
      - PIN
    deny: []
  mappings:
    - emoji: 🏷️
      ascii2: ST
      ascii3: TAG
      name: tag
      aliases:
        - label
        - stamp
    - emoji: ✅
      ascii2: OK
      ascii3: CHK
      name: check
      aliases:
        - approved
        - verified
    - emoji: 🔖
      ascii2: BM
      ascii3: BKM
      name: bookmark
      aliases:
        - mark
    - emoji: 📌
      ascii2: PN
      ascii3: PIN
      name: pin
      aliases:
        - pinned
        - marker
    - emoji: 🧾
      ascii2: RC
      ascii3: RCP
      name: receipt
      aliases:
        - proof
    - emoji: 📜
      ascii2: DC
      ascii3: DOC
      name: document
      aliases:
        - certificate
    - emoji: 🪪
      ascii2: ID
      ascii3: IDC
      name: identity
      aliases:
        - badge
    - emoji: 🔏
      ascii2: SG
      ascii3: SIG
      name: signed
      aliases:
        - sealed
    - emoji: 🖋️
      ascii2: IN
      ascii3: INK
      name: ink
      aliases:
        - pen
    - emoji: ✒️
      ascii2: PN
      ascii3: PEN
      name: pen
      aliases:
        - nib
    - emoji: 🧰
      ascii2: TB
      ascii3: BOX
      name: toolbox
      aliases:
        - tools
    - emoji: 🛠️
      ascii2: TL
      ascii3: TLS
      name: tools
      aliases:
        - build
    - emoji: 🚀
      ascii2: RX
      ascii3: RKT
      name: rocket
      aliases:
        - deploy
    - emoji: 🧪
      ascii2: QA
      ascii3: TST
      name: test
      aliases:
        - lab
    - emoji: 🎟️
      ascii2: TK
      ascii3: TKT
      name: ticket
      aliases:
        - pass
    - emoji: 🎫
      ascii2: TK
      ascii3: TIX
      name: ticket-alt
      aliases:
        - token
    - emoji: 🪙
      ascii2: CN
      ascii3: CON
      name: coin
      aliases:
        - token
    - emoji: 🧱
      ascii2: BL
      ascii3: BLD
      name: brick
      aliases:
        - build
    - emoji: 🔐
      ascii2: LK
      ascii3: LCK
      name: lock
      aliases:
        - secure
words:
  enabled: true
  count: 2
  case: lower
  separator: "-"
  allow:
    - silver
    - golden
    - crimson
    - azure
    - violet
    - amber
    - jade
    - coral
    - ivory
    - slate
    - river
    - forest
    - mountain
    - ocean
    - garden
    - canyon
    - valley
    - island
    - delta
    - glacier
    - melon
    - mango
    - banana
    - cherry
    - lemon
    - peach
    - plum
    - grape
    - orbit
    - pixel
    - vector
    - debug
    - patch
    - build
    - deploy
    - branch
    - matrix
    - kernel
    - socket
    - buffer
    - cipher
    - proxy
    - router
    - rocket
    - thunder
    - signal
    - echo
    - mirror
    - shadow
    - phantom
    - nova
    - spark
    - comet
  deny: []
  aliases:
    - word: melon
      code2: ML
      code3: MLN
      aliases:
        - watermelon
        - fruit
    - word: mango
      code2: MG
      code3: MNG
    - word: banana
      code2: BN
      code3: BNA
    - word: cherry
      code2: CH
      code3: CHR
    - word: lemon
      code2: LM
      code3: LMN
    - word: peach
      code2: PC
      code3: PCH
    - word: plum
