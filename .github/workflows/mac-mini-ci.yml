name: Mac mini CI
on:
  workflow_dispatch:
  push:
    branches: [main, master, codex/mac-mini-ci]
permissions:
  contents: read
concurrency:
  group: mac-mini-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: "TypeScript, unit tests, library/site builds, Chromium E2E"
    runs-on: [mac-mini-m4, macos-arm64]
    timeout-minutes: 40
    env:
      CI: "true"
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Host receipt
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          echo "Runner: $RUNNER_NAME; source: $GITHUB_SHA"
          sw_vers
          echo "Scope: TypeScript, unit tests, library/site builds, Chromium E2E" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: "1. npm ci --ignore-scripts --no-audit --no-fund"
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: "2. npm run check"
        run: |
          set -euo pipefail
          npm run check
      - name: "3. npm test"
        run: |
          set -euo pipefail
          npm test
      - name: "4. npm run build"
        run: |
          set -euo pipefail
          npm run build
      - name: "5. npm run site:build"
        run: |
          set -euo pipefail
          npm run site:build
      - name: "6. npx playwright install chromium"
        run: |
          set -euo pipefail
          npx playwright install chromium
      - name: "7. npm run test:e2e -- --headed"
        run: |
          set -euo pipefail
          npm run test:e2e -- --headed
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-mini-ci-${{ github.run_id }}
          path: |
            mac-ci-tests.xml
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove job dependency trees
        if: always()
        run: git clean -ffdx -- node_modules apps/web/node_modules .ci-venv
