name: Generate Stampog Build Stamp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stampog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate Stampog stamp
        run: npx stampog generate --config stampog.config.yml --out public/stampog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: stampog
          path: public/stampog.json
