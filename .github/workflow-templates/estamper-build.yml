name: Build With Estamper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - if: github.event_name != 'pull_request'
        run: npx --no-install estamper generate --js public/estamper.js
        env:
          ESTAMPER_PASSWORD: ${{ secrets.ESTAMPER_PASSWORD }}
      - run: npm run build
